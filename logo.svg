<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F2C2A"/>
    </linearGradient>
  </defs>

  <!-- app-icon shaped background -->
  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#bgGrad)"/>

  <!-- feed source -->
  <circle cx="48" cy="158" r="6" fill="#2DD4BF"/>

  <!-- signal reaching toward the bell -->
  <path d="M 48 128 A 30 30 0 0 1 78 158" fill="none" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
  <path d="M 48 104 A 54 54 0 0 1 102 158" fill="none" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <path d="M 48 80 A 78 78 0 0 1 126 158" fill="none" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- bell rim -->
  <rect x="110" y="92" width="64" height="8" rx="4" fill="#A7F3D0"/>

  <!-- bell body -->
  <path d="M 142 44
           C 158 44 168 58 168 76
           C 168 84 171 90 177 94
           L 107 94
           C 113 90 116 84 116 76
           C 116 58 126 44 142 44
           Z" fill="#ECFEFF"/>

  <!-- unread notification badge -->
  <circle cx="172" cy="48" r="12" fill="#0B1220"/>
  <circle cx="172" cy="48" r="9" fill="#FBBF24"/>
</svg>
